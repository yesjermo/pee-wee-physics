<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>urinal-physics</title>
<meta name="description" content="Interactive 3D fluid dynamics and spatial audio simulator: bladder mechanics, urine color dynamics, fluid arcs and synthesized liquid acoustics." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Serif+JP:wght@300&display=swap" rel="stylesheet" />
<style>
  /* The front page IS the simulator: the full app fills the window, the splash plays on top of it first. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eceef1; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

  /* ---------- splash: black & white message-board typing ---------- */
  #splash { position: fixed; inset: 0; z-index: 100; background: #000; color: #f2f2f2; overflow: hidden; cursor: pointer; transition: opacity .9s ease; }
  #splash.out { opacity: 0; pointer-events: none; }
  #splash .scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  #splash .bbshead { position: absolute; top: 6vh; left: 8vw; right: 8vw; display: flex; justify-content: space-between; border: 1px solid #f2f2f2; padding: 7px 12px;
    font: 400 11px 'JetBrains Mono', monospace; letter-spacing: .22em; opacity: 0; transition: opacity 1.2s ease; }
  #bbs { position: absolute; top: calc(6vh + 52px); bottom: 15vh; left: 8vw; right: 8vw; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    font: 400 13px/1.9 'JetBrains Mono', monospace; opacity: 0; transition: opacity 1.2s ease; }
  #splash.board .bbshead, #splash.board #bbs { opacity: 1; }
  #bbs .post { margin: 0 0 18px; }
  #bbs .meta { color: #8c8c8c; font-size: 11.5px; letter-spacing: .04em; }
  #bbs .meta b { color: #fff; font-weight: 400; }
  #bbs .body { padding-left: 2ch; white-space: pre-wrap; }
  #splash .caret { display: inline-block; width: 8px; height: 14px; background: #f2f2f2; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #flash { position: absolute; inset: 0; display: grid; place-items: center; font: 300 clamp(36px, 8vw, 96px)/1 'Noto Serif JP', serif; letter-spacing: .3em; color: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash 2.6s ease forwards; }
  @keyframes flash { 0% { opacity: 0; } 18% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  #enter { position: absolute; left: 8vw; bottom: 6vh; font: 400 11px 'JetBrains Mono', monospace; letter-spacing: .4em; color: #fff; background: transparent; border: 1px solid #fff; padding: 10px 20px; cursor: pointer; }
  #enter:hover { background: #fff; color: #000; }
  #splash .hint { position: absolute; right: 8vw; bottom: 6.8vh; font: 400 9px 'JetBrains Mono', monospace; letter-spacing: .3em; color: #6f6f6f; }
  @media (prefers-reduced-motion: reduce) { #splash .caret { animation: none; } }
</style>
</head>
<body>

<!-- The full simulator, exactly as on simulator.html -->
<iframe id="app" src="simulator.html" title="urinal-physics: 3D hydration and fluid simulator" allow="autoplay; fullscreen"></iframe>

<!-- Splash intro on top -->
<div id="splash" role="dialog" aria-label="Intro">
  <div id="flash">水のエーテル</div>
  <div class="bbshead"><span>■ ether-bbs ／ board: 水 water</span><span>online: 3</span></div>
  <div id="bbs" aria-live="polite"></div>
  <div class="scan"></div>
  <button id="enter">enter ▸</button>
  <div class="hint">click anywhere · press any key</div>
</div>

<script>
/* Splash: black screen, title flash, then message-board posts typing in (all original text).
   Shows once per browser session; add ?splash to the URL to always play it. */
(() => {
  const splash = document.getElementById('splash'), bbs = document.getElementById('bbs'), flash = document.getElementById('flash');
  const app = document.getElementById('app');
  const POSTS = [
    ['seiryu',      'the field is quiet tonight. only the wind and the pipes.'],
    ['water_ether', 'from the next room it sounds like rain.'],
    ['minty_06',    'drink water. it is the only thing that listens.'],
    ['seiryu',      'everything flows back to the same place eventually.'],
    ['anonymous',   'the stream goes up. the stream comes down. that is all physics is.'],
    ['water_ether', 'flush before you leave. the ether remembers.'],
  ];
  let alive = true, pi = 0;
  const stamp = i => `2026/11/08(土) 02:${String(14 + i * 3).padStart(2, '0')}:${String((i * 17 + 7) % 60).padStart(2, '0')}`;
  function nextPost() {
    if (!alive || pi >= POSTS.length) return;
    const [who, text] = POSTS[pi];
    const post = document.createElement('div'); post.className = 'post';
    post.innerHTML = `<div class="meta">No.${String(101 + pi).padStart(4, '0')}　name: <b>${who}</b>　${stamp(pi)}</div><div class="body"></div>`;
    bbs.appendChild(post);
    const body = post.querySelector('.body');
    let ci = 0;
    (function type() {
      if (!alive) return;
      ci++;
      body.innerHTML = text.slice(0, ci) + '<span class="caret"></span>';
      if (ci < text.length) setTimeout(type, 45 + Math.random() * 75);
      else { body.textContent = text; pi++; setTimeout(nextPost, 900); }
    })();
  }
  function hide() { alive = false; splash.style.display = 'none'; app.focus(); }
  function enter() {
    if (splash.classList.contains('out')) return;
    splash.classList.add('out');
    setTimeout(hide, 950);
    try { sessionStorage.setItem('up-splash-seen', '1'); } catch (e) {}
  }

  const forced = new URLSearchParams(location.search).has('splash');
  let seen = false;
  try { seen = !!sessionStorage.getItem('up-splash-seen'); } catch (e) {}
  if (seen && !forced) { hide(); return; }

  flash.classList.add('on');
  setTimeout(() => { splash.classList.add('board'); nextPost(); }, 2400);
  splash.addEventListener('click', enter);
  addEventListener('keydown', () => { if (splash.style.display !== 'none') enter(); }, { once: true });
})();
</script>
</body>
</html>
