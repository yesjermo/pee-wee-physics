<defs>
  <style>text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.jp{font-family:'Noto Serif JP','Hiragino Mincho ProN','Yu Mincho',serif;font-weight:300}.title{opacity:0;animation:title 16s linear infinite}@keyframes title{0%{opacity:0}4%{opacity:1}11%{opacity:1}15%{opacity:0}100%{opacity:0}}.board{opacity:1;animation:board 16s linear infinite}@keyframes board{0%,15%{opacity:0}17%,95%{opacity:1}100%{opacity:0}}.caret{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}.m0{opacity:1;animation:m0 16s linear infinite} @keyframes m0{0%,17%{opacity:0}18%,95%{opacity:1}100%{opacity:0}}.c0{transform:translateX(612px);animation:c0 16s steps(56) infinite} @keyframes c0{0%,18%{transform:translateX(0)}31%,96%{transform:translateX(612px)}100%{transform:translateX(0)}}.m1{opacity:1;animation:m1 16s linear infinite} @keyframes m1{0%,34%{opacity:0}35%,95%{opacity:1}100%{opacity:0}}.c1{transform:translateX(427px);animation:c1 16s steps(39) infinite} @keyframes c1{0%,35%{transform:translateX(0)}48%,96%{transform:translateX(427px)}100%{transform:translateX(0)}}.m2{opacity:1;animation:m2 16s linear infinite} @keyframes m2{0%,51%{opacity:0}52%,95%{opacity:1}100%{opacity:0}}.c2{transform:translateX(514px);animation:c2 16s steps(47) infinite} @keyframes c2{0%,52%{transform:translateX(0)}65%,96%{transform:translateX(514px)}100%{transform:translateX(0)}}.m3{opacity:1;animation:m3 16s linear infinite} @keyframes m3{0%,68%{opacity:0}69%,95%{opacity:1}100%{opacity:0}}.c3{transform:translateX(481px);animation:c3 16s steps(44) infinite} @keyframes c3{0%,69%{transform:translateX(0)}82%,96%{transform:translateX(481px)}100%{transform:translateX(0)}}</style>
